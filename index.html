<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="작은 놀이공원이 문을 열었어요. 질러보고, 규칙대로 살아보고, 멋대로 시상하고, 인생 스포까지 당해본 일상 기록.">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>소소한 생활 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&family=Noto+Serif+KR:wght@700&display=swap">
<style>
/* Layout: 입구(티켓) → 놀이공원 지도(코너 = 놀이기구) → 코너 상세. 솜사탕 파스텔 위 스티커 카드, 인생 스포만 밤의 놀이공원 */
:root {
  --bg: #F7F3FF;
  --glass: rgba(247, 243, 255, .9);
  --dot: rgba(143, 107, 255, .10);
  --blob-a: rgba(255, 196, 222, .55);
  --blob-b: rgba(190, 240, 220, .55);
  --blob-c: rgba(201, 220, 255, .60);
  --blob-d: rgba(255, 236, 170, .50);
  --card: #FFFFFF;
  --ink: #3A2E4D;
  --muted: #7A6E8C;
  --accent: #8C68F5;
  --accent-soft: #ECE4FF;
  --good: #23927A;
  --meh: #D17A22;
  --bad: #DD4C76;
  --tip: #FFF3C4;
  --tip-ink: #6A5110;
  --pink: #FFC6DD;
  --mint: #B9EDD6;
  --sky: #C7DAFF;
  --butter: #FFE79E;
  --lilac: #DCCAFF;
  --ground: #E9F7EF;
  --path: #FFF6DC;
  --path-line: #E7C979;
  --night: #2E2A5C;
  --night-2: #3B3670;
  --night-line: rgba(255, 255, 255, .16);
  --night-ink: #F6F1FF;
  --night-muted: #C7BDEA;
  --star: rgba(255, 255, 255, .5);
  --gold: #FFE08A;
  --f-serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-hand: "Gaegu", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1929; --glass: rgba(29, 25, 41, .9); --dot: rgba(184, 156, 255, .10);
    --blob-a: rgba(160, 70, 120, .30); --blob-b: rgba(60, 140, 115, .28); --blob-c: rgba(80, 105, 190, .30); --blob-d: rgba(150, 125, 50, .22);
    --card: #29233D; --ink: #F1EBFF; --muted: #B3A8C8; --accent: #B79BFF; --accent-soft: #3A3160;
    --good: #7FE0C5; --meh: #FFBE78; --bad: #FF93B1; --tip: #3A3320; --tip-ink: #FFE6A0;
    --pink: #6B3C5E; --mint: #2F5B4E; --sky: #36457A; --butter: #66572A; --lilac: #4A3E78;
    --ground: #1F2E2B; --path: #3A3326; --path-line: #8C7642;
    --night: #221E45; --night-2: #2F2A5A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1929; --glass: rgba(29, 25, 41, .9); --dot: rgba(184, 156, 255, .10);
  --blob-a: rgba(160, 70, 120, .30); --blob-b: rgba(60, 140, 115, .28); --blob-c: rgba(80, 105, 190, .30); --blob-d: rgba(150, 125, 50, .22);
  --card: #29233D; --ink: #F1EBFF; --muted: #B3A8C8; --accent: #B79BFF; --accent-soft: #3A3160;
  --good: #7FE0C5; --meh: #FFBE78; --bad: #FF93B1; --tip: #3A3320; --tip-ink: #FFE6A0;
  --pink: #6B3C5E; --mint: #2F5B4E; --sky: #36457A; --butter: #66572A; --lilac: #4A3E78;
  --ground: #1F2E2B; --path: #3A3326; --path-line: #8C7642;
  --night: #221E45; --night-2: #2F2A5A; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(var(--dot) 1.4px, transparent 1.6px),
    radial-gradient(60vmax 40vmax at 8% 4%, var(--blob-a), transparent 70%),
    radial-gradient(50vmax 40vmax at 95% 12%, var(--blob-c), transparent 70%),
    radial-gradient(55vmax 45vmax at 85% 70%, var(--blob-b), transparent 70%),
    radial-gradient(50vmax 40vmax at 5% 90%, var(--blob-d), transparent 70%);
  background-size: 22px 22px, auto, auto, auto, auto;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.view { max-width: 1120px; margin: 0 auto; display: grid; gap: 36px; min-width: 0; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* 공통 조각 */
.note-label {
  justify-self: start; font-family: var(--f-hand); font-size: 1.05rem; font-weight: 700;
  background: var(--card); border: 2px dashed var(--accent); color: var(--accent); border-radius: 999px; padding: 0 12px;
}
.hl { background: linear-gradient(transparent 58%, var(--pink) 58%, var(--pink) 92%, transparent 92%); padding: 0 4px; border-radius: 4px; }
.lede { margin: 0; color: var(--muted); max-width: 60ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.stat { font-size: .9rem; background: var(--card); border: 1.5px solid var(--lilac); border-radius: 999px; padding: 2px 12px; color: var(--muted); }
.stat b { color: var(--ink); font-weight: 400; font-family: var(--f-display); }
.sample-note { font-size: .9rem; color: var(--tip-ink); background: var(--tip); border-radius: 14px; padding: 8px 14px; justify-self: start; margin: 0; }
.pill-btn {
  font-family: var(--f-display); font-size: 1rem; color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 999px; padding: 5px 16px; cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink); transition: transform .12s, box-shadow .12s; white-space: nowrap;
}
.pill-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.pill-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.pill-btn.pink { background: var(--pink); }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin 26s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 1. 입구 ─────────────────────── */
.gate { min-height: calc(100svh - 92px); align-content: center; justify-items: center; text-align: center; gap: 22px; }
.gate-art { position: relative; width: min(560px, 100%); display: grid; justify-items: center; }
.gate-wheel { width: min(230px, 56vw); height: auto; margin-bottom: -78px; overflow: visible; }
.arch { position: relative; z-index: 1; width: 100%; display: grid; justify-items: center; }
.bunting { width: 92%; height: 26px; display: block; margin-bottom: -6px; }
.plate {
  width: 100%; background: var(--card); border: 2.5px solid var(--ink); border-radius: 28px;
  padding: 16px clamp(14px, 4vw, 28px) 18px; display: grid; justify-items: center; gap: 6px; box-shadow: 6px 6px 0 var(--lilac);
}
.plate .note-label { justify-self: center; }
.gate h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.3rem, 8vw, 3.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.pillars { width: 84%; display: flex; justify-content: space-between; height: 92px; }
.pillar {
  width: 30px; height: 100%; border: 2px solid var(--ink); border-top: none; border-radius: 0 0 10px 10px;
  background: repeating-linear-gradient(180deg, var(--pink) 0 15px, var(--card) 15px 30px);
}
.gate .lede { text-align: center; margin-top: -4px; }
.ticket-btn {
  display: flex; align-items: stretch; cursor: pointer; background: transparent; border: none; padding: 0;
  filter: drop-shadow(4px 4px 0 var(--ink));
}
.ticket-btn .stub, .ticket-btn .main { background: var(--butter); border: 2.5px solid var(--ink); display: grid; place-items: center; }
.ticket-btn .stub {
  font-family: var(--f-hand); font-weight: 700; font-size: .8rem; line-height: 1; padding: 6px 9px; border-right: none;
  border-radius: 16px 0 0 16px; writing-mode: vertical-rl; letter-spacing: .08em; transition: transform .35s, opacity .35s;
}
.ticket-btn .main {
  font-family: var(--f-display); font-size: 1.55rem; padding: 14px 34px; border-radius: 0 16px 16px 0;
  border-left: 2.5px dashed var(--ink); background: var(--pink);
}
.ticket-btn:hover .main { background: var(--butter); }
.ticket-btn.torn .stub { transform: translate(-12px, 26px) rotate(-28deg); opacity: 0; }
.gate-small { margin: 0; font-size: .88rem; color: var(--muted); }

/* ── 2. 지도 ─────────────────────── */
.map-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: end; }
.map-head-text { display: grid; gap: 8px; min-width: 0; }
.map-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.2; margin: 0; }
.map-head .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.map-box { min-width: 0; }
.map { display: block; width: 100%; height: auto; overflow: visible; }
.map-tall { display: none; }
.map text { font-family: var(--f-display); fill: var(--ink); }
.map text.sub { font-family: var(--f-body); fill: var(--muted); }
.zone { cursor: pointer; outline: none; }
.zone .lift { transition: transform .2s ease; }
.zone:hover .lift, .zone:focus-visible .lift { transform: translateY(-6px); }
.zone:focus-visible .sign-bg { stroke: var(--accent); stroke-width: 4; }
.course { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.course-btn {
  text-align: left; cursor: pointer; background: var(--card); border: 2px solid var(--ink); border-radius: 20px;
  padding: 12px 14px; display: grid; gap: 2px; box-shadow: 4px 4px 0 var(--c); transition: transform .15s; min-width: 0;
}
.course-btn:hover { transform: translateY(-2px); }
.course-btn .c-ride { font-family: var(--f-hand); font-weight: 700; font-size: .98rem; color: var(--accent); }
.course-btn strong { font-family: var(--f-display); font-weight: 400; font-size: 1.12rem; line-height: 1.3; }
.course-btn span.c-desc { font-size: .84rem; color: var(--muted); }
.c-pink { --c: var(--pink); } .c-butter { --c: var(--butter); } .c-sky { --c: var(--sky); } .c-mint { --c: var(--mint); }

/* ── 3. 상세 ─────────────────────── */
.detail-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; min-width: 0;
  background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 2px solid var(--ink); border-radius: 22px; padding: 8px; box-shadow: 4px 4px 0 var(--c);
}
.bar-name { min-width: 0; text-align: center; font-family: var(--f-display); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail-bar .bar-btn { justify-self: start; }
.bar-btn { font-family: var(--f-display); font-size: .98rem; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; padding: 4px 12px; cursor: pointer; white-space: nowrap; }
.bar-btn.next { background: var(--c); }
.bar-btn .short { display: none; }
.section { display: grid; gap: 18px; --c: var(--lilac); min-width: 0; }
.s-bought { --c: var(--pink); } .s-rule { --c: var(--butter); } .s-tier { --c: var(--sky); } .s-saju { --c: var(--mint); }
.section-head { display: grid; gap: 6px; }
.section-head .ride { font-family: var(--f-hand); font-weight: 700; font-size: 1.1rem; color: var(--accent); }
.section-head h2 {
  font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8rem, 5vw, 2.4rem); margin: 0; justify-self: start;
  background: linear-gradient(transparent 55%, var(--c) 55%, var(--c) 92%, transparent 92%); padding: 0 6px; border-radius: 4px; line-height: 1.25;
}
.section-head p { margin: 0; color: var(--muted); }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.count { font-family: var(--f-hand); font-size: 1.15rem; color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.chip-label { font-size: .85rem; color: var(--muted); align-self: center; margin-right: 4px; letter-spacing: .02em; }
.chip { font-size: .9rem; background: var(--card); border: 1.5px solid var(--lilac); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.next-course {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  border: 2px dashed var(--lilac); border-radius: 24px; padding: 16px 18px;
}
.next-course p { margin: 0; color: var(--muted); }
.next-course p b { font-family: var(--f-display); font-weight: 400; color: var(--ink); font-size: 1.15rem; }

/* 카드: 높이가 제각각이라 단(column)으로 빈칸 없이 */
.grid { columns: 3 280px; column-gap: 22px; }
.grid > .card { break-inside: avoid; margin-bottom: 22px; }
.card {
  position: relative; background: var(--card); border: 2px solid var(--ink); border-radius: 22px;
  padding: 16px 18px 14px; display: grid; gap: 10px; box-shadow: 5px 5px 0 var(--c); min-width: 0;
  scroll-margin: 100px; transition: transform .15s;
}
.card:hover { transform: translateY(-2px) rotate(-.4deg); }
.card.pulse, .spoiler.pulse { animation: pulse 1.8s ease-out; }
@keyframes pulse { 30% { box-shadow: 5px 5px 0 var(--c), 0 0 0 9px var(--accent-soft); } }
.meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.meta-left { font-size: .8rem; color: var(--muted); letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.stamp {
  font-family: var(--f-hand); font-weight: 700; font-size: 1.1rem; line-height: 1.2;
  border: 3px double currentColor; border-radius: 10px; padding: 1px 9px; transform: rotate(-6deg); white-space: nowrap;
}
.stamp.good { color: var(--good); }
.stamp.meh { color: var(--meh); transform: rotate(4deg); }
.stamp.bad { color: var(--bad); transform: rotate(-3deg); }
.card h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; line-height: 1.3; margin: 0; text-wrap: balance; }
.card p { margin: 0; }
.tip { background: var(--tip); color: var(--tip-ink); border-radius: 14px; padding: 9px 12px; font-size: .95rem; }
.tip b { display: block; font-family: var(--f-hand); font-size: 1.05rem; }
.foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.tags { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.like { font-family: var(--f-hand); font-size: 1.05rem; font-weight: 700; background: transparent; color: var(--muted); border: 1.5px solid var(--lilac); border-radius: 999px; padding: 0 10px; cursor: pointer; }
.like[aria-pressed="true"] { color: var(--bad); border-color: var(--bad); background: var(--card); }
.card.rule { padding-top: 22px; }
.card.rule::before {
  content: ""; position: absolute; top: -11px; left: 50%; width: 78px; height: 22px;
  background: var(--c); opacity: .9; transform: translateX(-50%) rotate(-3deg); border-radius: 4px;
}
.card.rule h3 { font-family: var(--f-hand); font-weight: 700; font-size: 1.5rem; }
.since { font-family: var(--f-hand); font-size: 1rem; font-weight: 700; color: var(--accent); }

/* 시상대 */
.tier-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 22px; align-items: start; }
.board { background: var(--card); border: 2px solid var(--ink); border-radius: 22px; padding: 16px 18px; box-shadow: 5px 5px 0 var(--c); display: grid; gap: 12px; min-width: 0; }
.board h3 { font-family: var(--f-display); font-weight: 400; font-size: 1.3rem; margin: 0; }
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; padding-top: 4px; }
.place { display: grid; gap: 4px; text-align: center; min-width: 0; }
.place strong { font-weight: 400; font-family: var(--f-display); font-size: 1.02rem; line-height: 1.25; }
.place .why { font-size: .8rem; color: var(--muted); line-height: 1.35; margin-bottom: 4px; }
.block { border: 2px solid var(--ink); border-radius: 14px 14px 6px 6px; display: grid; align-content: start; justify-items: center; padding-top: 6px; font-family: var(--f-display); font-size: 1.35rem; line-height: 1.1; color: var(--ink); }
.block small { font-family: var(--f-hand); font-weight: 700; font-size: 1rem; }
.block.S { height: 96px; background: var(--pink); }
.block.A { height: 76px; background: var(--mint); }
.block.B { height: 60px; background: var(--butter); }
.crown { font-family: var(--f-hand); font-weight: 700; color: var(--accent); font-size: 1.05rem; line-height: 1; }
.consolation { display: flex; align-items: center; gap: 10px; border-top: 2px dashed var(--lilac); padding-top: 10px; min-width: 0; }
.consolation .c-badge { flex: none; font-family: var(--f-hand); font-weight: 700; font-size: .95rem; background: var(--lilac); color: var(--ink); border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; }
.consolation div { min-width: 0; font-size: .9rem; color: var(--muted); }
.consolation strong { font-weight: 400; font-family: var(--f-display); color: var(--ink); margin-right: 6px; }

/* 인생 스포: 밤의 놀이공원 */
.night {
  --good: #8FE6CD; --meh: #FFC98A; --bad: #FF9DB8;
  background:
    radial-gradient(var(--star) 1px, transparent 1.6px) 0 0 / 36px 36px,
    radial-gradient(var(--star) 1px, transparent 1.6px) 18px 14px / 36px 36px,
    var(--night);
  color: var(--night-ink); border: 2px solid var(--ink); border-radius: 32px;
  box-shadow: 6px 6px 0 var(--c); padding: 26px clamp(16px, 4vw, 32px) 30px; display: grid; gap: 28px; min-width: 0;
}
.t-label { font-family: var(--f-hand); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; }
.night-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: stretch; }
.ticket { background: var(--gold); color: var(--night); border-radius: 22px; padding: 18px 20px; display: grid; gap: 4px; outline: 2px dashed var(--night); outline-offset: -9px; min-width: 0; align-content: start; }
.t-hanja { font-family: var(--f-serif); font-weight: 700; font-size: 3.2rem; line-height: 1.1; }
.ticket strong { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.ticket p { margin: 0; font-size: .92rem; }
.orbs-box { background: var(--night-2); border: 1.5px solid var(--night-line); border-radius: 22px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.orbs-box .t-label, .today .t-label { color: var(--gold); }
.orbs { display: flex; flex-wrap: wrap; justify-content: space-around; align-items: flex-end; gap: 18px 6px; padding-top: 12px; }
.orb-wrap { display: grid; justify-items: center; gap: 4px; position: relative; }
.orb { position: relative; width: calc(30px + var(--p) * 1.1px); height: calc(30px + var(--p) * 1.1px); border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--night-ink); color: var(--ink); font-family: var(--f-serif); font-weight: 700; font-size: 1.15rem; }
.mint { --o: var(--mint); } .pink { --o: var(--pink); } .butter { --o: var(--butter); } .lilac { --o: var(--lilac); } .sky { --o: var(--sky); }
.orb, .pbar span { background: var(--o); }
.orb-name { font-size: .85rem; color: var(--night-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.orb-name b { font-weight: 400; font-family: var(--f-display); color: var(--night-ink); font-size: 1rem; }

function star(cx, cy, r) {
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1) + ' ';
  }
  return `<path d="${d}Z" fill="var(--gold)" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>`;
}

  return `<g class="sign">
    <rect x="${-w / 2 + 4}" y="4" width="${w}" height="${h}" rx="${h / 2.4}" fill="var(--${color})" stroke="var(--ink)" stroke-width="2"/>
    <rect class="sign-bg" x="${-w / 2}" y="0" width="${w}" height="${h}" rx="${h / 2.4}" fill="var(--card)" stroke="var(--ink)" stroke-width="2.4"/>
    <text x="0" y="${(fs * 1.2).toFixed(1)}" text-anchor="middle" font-size="${fs}">${esc(name)}</text>
    <text class="sub" x="0" y="${(fs * 1.2 + fs2 * 1.45).toFixed(1)}" text-anchor="middle" font-size="${fs2}">${esc(sub)}</text>
  </g>`;
}

const STEM_H = '甲乙丙丁戊己庚辛壬癸', STEM_K = '갑을병정무기경신임계';
const BR_H = '子丑寅卯辰巳午未申酉戌亥', BR_K = '자축인묘진사오미신유술해';
const EL = [ // 목 화 토 금 수
  { k: '목', h: '木', c: 'mint' }, { k: '화', h: '火', c: 'pink' }, { k: '토', h: '土', c: 'butter' },
  { k: '금', h: '金', c: 'lilac' }, { k: '수', h: '水', c: 'sky' } ];
const stemEl = s => Math.floor(s / 2);
const BR_EL = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4];
// 지지 속에 숨은 기운(지장간): [천간 번호, 비율(30일 기준)]
const HIDDEN = [
  [[8, 10], [9, 20]], [[9, 9], [7, 3], [5, 18]], [[4, 7], [2, 7], [0, 16]], [[0, 10], [1, 20]],
  [[1, 9], [9, 3], [4, 18]], [[4, 7], [6, 7], [2, 16]], [[2, 10], [5, 9], [3, 11]], [[3, 9], [1, 3], [5, 18]],
  [[4, 7], [8, 7], [6, 16]], [[6, 10], [7, 20]], [[7, 9], [3, 3], [4, 18]], [[4, 7], [0, 7], [8, 16]] ];
const BR_MAIN = [9, 5, 0, 1, 4, 2, 3, 5, 6, 7, 4, 8]; // 지지 본기

// 태양 황경(도). 오차 약 0.01도 = 15분 안팎
function sunLongitude(ms) {
  const jd = ms / 86400000 + 2440587.5, T = (jd - 2451545) / 36525, r = Math.PI / 180;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * r;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) + (0.019993 - 0.000101 * T) * Math.sin(2 * M) + 0.000289 * Math.sin(3 * M);
  const om = (125.04 - 1934.136 * T) * r;
  return (((L0 + C - 0.00569 - 0.00478 * Math.sin(om)) % 360) + 360) % 360;
}
const mod = (a, n) => ((a % n) + n) % n;
const dayIndex = (y, m, d) => mod(Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1949, 9, 1)) / 86400000), 60);

// y, m, d: 양력 / hh, mm: 한국 시각 (null이면 시간 모름)
function calcPillars(y, m, d, hh, mm) {
  const known = hh != null;
  const utc = Date.UTC(y, m - 1, d, known ? hh : 12, known ? mm : 0) - 9 * 3600000;
  const lon = sunLongitude(utc);
  const mi = Math.floor(mod(lon - 315, 360) / 30);              // 0 = 인월
  const sy = (m <= 2 && mi >= 10) ? y - 1 : y;                  // 입춘 전이면 전년도
  const ys = mod(sy - 4, 10), yb = mod(sy - 4, 12);
  const ms = mod((ys % 5) * 2 + 2 + mi, 10), mb = mod(mi + 2, 12);
  // 한국 표준시는 실제 태양시보다 약 30분 빨라서 30분 당겨서 시를 정해요 (자시 23:30~01:30)
  let hb = null, hs = null, dd = dayIndex(y, m, d);
  if (known) {
    const t = hh * 60 + mm - 30;
    const tt = mod(t, 1440);
    if (t >= 23 * 60) dd = mod(dd + 1, 60);                     // 밤 11시(보정 후) 이후는 다음 날 자시
    hb = Math.floor(mod(tt + 60, 1440) / 120);
  }
  const ds = dd % 10, db = dd % 12;
  if (known) hs = mod((ds % 5) * 2 + hb, 10);
  return { y: [ys, yb], m: [ms, mb], d: [ds, db], h: known ? [hs, hb] : null, lon };
}

// 십성 그룹: 0 비겁, 1 식상, 2 재성, 3 관성, 4 인성
const GROUP = ['비겁', '식상', '재성', '관성', '인성'];
const TEN = [['비견', '겁재'], ['식신', '상관'], ['편재', '정재'], ['편관', '정관'], ['편인', '정인']];
const relGroup = (me, el) => mod(el - stemEl(me), 5);
const tenGod = (me, s) => TEN[relGroup(me, stemEl(s))][(me % 2) === (s % 2) ? 0 : 1];

function analyze(P) {
  const me = P.d[0];
  const pts = [0, 0, 0, 0, 0];
  const stems = [P.y[0], P.m[0], P.d[0]].concat(P.h ? [P.h[0]] : []);
  stems.forEach(s => pts[stemEl(s)] += 10);
  const brs = [[P.y[1], 10], [P.m[1], 30], [P.d[1], 10]].concat(P.h ? [[P.h[1], 10]] : []);
  brs.forEach(([b, w]) => HIDDEN[b].forEach(([s, n]) => pts[stemEl(s)] += w * n / 30));
  const total = pts.reduce((a, b) => a + b, 0);
  // 반올림 합이 100이 되도록
  const raw = pts.map(v => v * 100 / total), fl = raw.map(Math.floor);
  let left = 100 - fl.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => fl[i]++);
  // 십성: 일간 빼고 보이는 천간 + 지지 본기
  const gods = {};
  const others = [P.y[0], P.m[0]].concat(P.h ? [P.h[0]] : []).concat([P.y[1], P.m[1], P.d[1]].concat(P.h ? [P.h[1]] : []).map(b => BR_MAIN[b]));
  others.forEach(s => { const g = tenGod(me, s); gods[g] = (gods[g] || 0) + 1; });
  const groupN = GROUP.map((_, gi) => TEN[gi].reduce((a, g) => a + (gods[g] || 0), 0));
  return { me, pct: fl, gods, groupN };
}

  if (has('편인') && has('식신')) combo.push(['편인과 식신', '하고 싶은 게 떠올라도 생각이 많아서 시작 전에 멈칫한대요']);
  else if (N[4] && N[1]) combo.push(['인성과 식상', '배운 걸 내 말로 풀어내는 걸 잘한대요']);
  if (N[1] && N[2]) combo.push(['식상과 재성', '재주가 돈으로 이어지는 구조래요. 좋아하는 걸 일로 만들기 좋대요']);
  if (N[3] && N[4]) combo.push(['관성과 인성', '책임감과 배움이 서로 돕는 구조래요. 맡은 자리에서 인정받기 좋대요']);
  if (N[2] && N[3]) combo.push(['재성과 관성', '현실 감각과 책임감이 같이 있어서 믿음직하대요']);
  if (has('상관') && has('정관')) combo.push(['상관과 정관', '할 말은 하는 편이라 윗사람과 부딪힐 때가 있대요']);
  if (N[0] >= 2 && N[2]) combo.push(['비겁과 재성', '사람 챙기느라 지갑이 자주 열린대요']);
  const MANY = { 비견: '나와 닮은 사람들과 함께할 때 힘이 난대요', 겁재: '승부욕이 있어서 지는 걸 싫어한대요',
    식신: '먹는 것, 만드는 것, 표현하는 걸 좋아하는 아이가 안에 산대요', 상관: '말솜씨와 재치가 좋아서 분위기를 잘 띄운대요',
    편재: '스케일이 크고 사람을 잘 모은대요', 정재: '돈은 한 방보다 차곡차곡 모으는 타입이래요',
    편관: '압박 속에서 오히려 강해지는 타입이래요', 정관: '규칙과 약속을 잘 지키는 반듯한 타입이래요',
    편인: '생각이 너무 많대요. 대신 남들이 못 보는 걸 보는 촉이 있대요', 정인: '배우는 걸 좋아하고 사람들에게 아낌받는대요' };
  const NUM = ['', '하나', '둘', '셋', '넷', '다섯', '여섯', '일곱'];
  Object.keys(G).filter(t => G[t] >= 2).sort((x, z) => G[z] - G[x]).forEach(t => many.push([`${t} ${NUM[G[t]] || G[t]}`, MANY[t]]));
  // 세 묶음에서 번갈아 하나씩 골라 다양하게
  const pools = [many, combo, meet];
  for (let round = 0; notes.length < 8 && pools.some(q => q.length); round++) {
    const q = pools[round % 3];
    if (q.length) { const [src, title] = q.shift(); add(src, title); }
  }
  const ps = mod(me + 5, 10), pb = mod(1 - P.d[1], 12), pill = STEM_K[ps] + BR_K[pb];
  const now = new Date().getFullYear();
  let Y = now; while (mod(Y - 4, 10) !== ps || mod(Y - 4, 12) !== pb) Y++;
  add('궁합', `${STEM_INFO[ps].nick} 같은 ${stemName(ps)}(${STEM_H[ps]}) 일간과 잘 맞는대요`, {
    more: `특히 ${pill}일주와는 하늘도 땅도 합인 천지합이래요`,
    extra: [['찰떡', `${pill}일주 · ${stemName(ps)} 일간`], ['보너스', Y === now ? `${Y}년이 마침 ${pill}년이에요` : `다음 찰떡의 해는 ${Y}년, ${pill}년이래요`]] });
  const castOrder = [1, 2, 4, 3, 0];
  const cast = castOrder.map(gi => {
    const n = A.groupN[gi], R = RIDES[gi];
    const label = n ? TEN[gi].filter(t => A.gods[t]).map(t => `${t} ${A.gods[t]}`).join(' · ') : GROUP[gi] + ' × 0';
    return { label, nick: R.nick, job: n ? R.job + (n >= 3 ? '. 늘 붐벼요' : '') : R.off, empty: !n };
  });
  const when = `${y}년 ${m}월 ${d}일${g.noTime ? '' : ' ' + g.time}`;
  return {
    mode: 'guest', label: '손님의 자유이용권', viewing: `${when}에 태어난 손님의 사주예요${g.noTime ? ' · 시간 모름' : ''}`,
    hero: { hanja: STEM_H[me], name: stemName(me), nick: info.nick,

    pillars: [['시', P.h], ['일', P.d], ['월', P.m], ['년', P.y]],
    elements, today: todayFor(me, A.groupN), cast, notes, chem: chemistry(P, A),
    elementsNote: `태어난 달이 ${sea}의 ${BR_K[P.m[1]]}월이라 계절 기운에 가중치를 주고, 글자 속에 숨은 기운까지 나눠 계산했어요. ${EL[maxI].k} 기운이 ${A.pct[maxI]}%로 제일 세요.` +
      (g.noTime ? ' 태어난 시간을 몰라서 세 기둥으로만 계산했어요.' : ''),
  };
}

/* ── 운영자와의 케미 궁합 (성별 없이 보는 사람 대 사람 궁합) ──
   운영자 사주는 여덟 글자를 통째로 넣지 않고, 궁합에 필요한 것만 넣었어요 */
const OP = { stem: 7, branch: 7, pct: [22, 13, 15, 10, 40] }; // 신금 일간, 미토 일지, 오행 비중
function chemistry(P, A) {
  const g = P.d[0], gb = P.d[1], reasons = [];
  let score = 3;
  const push = (pt, text) => { score += pt; reasons.push({ pt, text }); };
  const ge = stemEl(g), oe = stemEl(OP.stem);
  if (g === mod(OP.stem + 5, 10)) push(3, '일간끼리 서로 끌어당기는 합이에요');
  else if (g === OP.stem) push(1, '둘 다 신금이라 서로를 거울처럼 알아봐요');
  else if (ge === oe) push(1, '같은 금 기운이라 말이 잘 통해요');
  else if (mod(oe - ge, 5) === 1) push(2, '손님이 운영자를 든든하게 받쳐주는 사이예요');
  else if (mod(ge - oe, 5) === 1) push(2, '운영자가 손님을 챙겨주는 사이예요');
  else if (mod(oe - ge, 5) === 2) push(0, '손님이 운영자를 단련시키는 사이예요. 적당한 긴장감이 있어요');
  else push(0, '운영자가 손님을 다듬어주는 사이예요. 가끔은 잔소리가 될 수도 있어요');
  if (gb === mod(1 - OP.branch, 12)) push(2, '일지가 합이라 같이 있으면 편해요');
  else if (gb === mod(OP.branch + 6, 12)) push(-1, '일지가 부딪혀서 가끔 티격태격해요');
  else if (gb === OP.branch) push(1, '일지가 같아서 생활 리듬이 비슷해요');
  else if (mod(gb - OP.branch, 4) === 0) push(1, '일지가 삼합이라 같은 방향을 봐요');
  if (A.pct[3] >= 20) push(1, '운영자에게 부족한 금 기운을 손님이 채워줘요');
  if (A.pct[1] >= 25) push(1, '한겨울생 운영자에게 손님의 불 기운이 따뜻한 볕이 돼요');
  const weak = A.pct.indexOf(Math.min(...A.pct));
  if (OP.pct[weak] >= 20) push(1, `손님에게 부족한 ${EL[weak].k} 기운을 운영자가 채워줘요`);
  const jackpot = g === 2 && gb === 6;
  score = jackpot ? 8 : Math.max(1, Math.min(8, score));
  const title = jackpot ? '찰떡 당첨!' : score >= 6 ? '환상의 케미' : score >= 4 ? '좋은 동행' : score >= 2 ? '티격태격 케미' : '반대라서 끌리는 사이';
  reasons.sort((a, b) => b.pt - a.pt);
  const shown = reasons.filter(r => r.pt > 0).slice(0, 3).concat(reasons.filter(r => r.pt < 0).slice(0, 1));
  return { score, title, jackpot, reasons: (shown.length ? shown : reasons.slice(0, 1)).map(r => r.text) };
}
function chemWheel(score) {
  const cols = ['pink', 'mint', 'sky', 'butter', 'lilac', 'pink', 'mint', 'sky'];
  const cab = cols.map((c, i) => {
    const a = (-90 + i * 45) * Math.PI / 180, x = (60 + Math.cos(a) * 42).toFixed(1), y = (60 + Math.sin(a) * 42).toFixed(1);
    return i < score ? `<circle cx="${x}" cy="${y}" r="10" fill="var(--${c})" stroke="var(--night-ink)" stroke-width="2"/>`
      : `<circle cx="${x}" cy="${y}" r="9" fill="none" stroke="var(--night-muted)" stroke-width="1.6" stroke-dasharray="3 3"/>`;
  }).join('');
  const spokes = [0, 45, 90, 135].map(d => { const a = d * Math.PI / 180, dx = Math.cos(a) * 42, dy = Math.sin(a) * 42;
    return `<path d="M${(60 - dx).toFixed(1)} ${(60 - dy).toFixed(1)} L${(60 + dx).toFixed(1)} ${(60 + dy).toFixed(1)}"/>`; }).join('');
  return `<svg class="chem-wheel" viewBox="0 0 120 120" role="img" aria-label="관람차 8칸 중 ${score}칸에 불이 켜졌어요">
    <circle cx="60" cy="60" r="42" fill="none" stroke="var(--night-ink)" stroke-width="2.4"/>
    <g stroke="var(--night-line)" stroke-width="2">${spokes}</g>${cab}
    <circle cx="60" cy="60" r="12" fill="var(--gold)" stroke="var(--night-ink)" stroke-width="2"/>
    <text x="60" y="65" text-anchor="middle" font-size="14" fill="var(--night)">${score}</text></svg>`;
}

  if (R.mode !== 'guest') return `<div><h3 class="night-h">운영자와의 케미<span>성별 없이 보는 사람 대 사람 궁합이에요</span></h3>
    <div class="chem teaser"><p>접수처에 생년월일을 넣으면 손님과 운영자의 케미를 관람차 칸으로 알려드려요.</p></div></div>`;

function go(view, opts = {}) {
  if (SECTIONS.some(s => s.key === view) && state.view !== view && !opts.keepFilter) { state.tag = null; state.likedOnly = false; }
  state.view = view;
  $('v-gate').hidden = view !== 'gate';
  $('v-map').hidden = view !== 'map';
  $('v-detail').hidden = view === 'gate' || view === 'map';
  if (view === 'map') renderMap();
  else if (view !== 'gate') renderDetail(view);
  if (!opts.keepScroll) window.scrollTo(0, 0);
}

function pickRandom() {
  const pool = RECORDS.filter(r => r.verdict !== 'bad');
  const r = pool[Math.floor(Math.random() * pool.length)];
  if (r.type === 'saju') state.sajuMode = 'example';
  go(r.type);
  const el = $(r.id);
  if (el) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(() => {
      el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
      el.classList.add('pulse');
    });
  }
  const t = $('toast');
  t.textContent = `관람차가 내려준 곳: ${r.type === 'saju' ? '쪽지 #' + r.no : r.title}`;
  t.hidden = false;
  clearTimeout(pickRandom.timer);
  pickRandom.timer = setTimeout(() => { t.hidden = true; }, 2600);
}

document.addEventListener('click', e => {
  const z = e.target.closest('[data-go],[data-pick],[data-veil],[data-tag],[data-liked],[data-like],[data-example]');
  if (!z) return;
  if (z.dataset.pick) return pickRandom();
  if (z.dataset.example) { state.sajuMode = 'example'; return showReading(); }
  if (z.dataset.go) return go(z.dataset.go);
  if (z.dataset.veil) {
    const rv = $(z.dataset.veil).querySelector('.reveal'), open = rv.hidden;
    rv.hidden = !open;
    z.setAttribute('aria-expanded', open);
    z.classList.toggle('open', open);
    z.textContent = open ? '다시 접기' : '펼쳐보기';
    return;
  }
  if (z.dataset.tag) { state.tag = state.tag === z.dataset.tag ? null : z.dataset.tag; return go(state.view, { keepFilter: true, keepScroll: true }); }
  if (z.dataset.liked) { state.likedOnly = !state.likedOnly; return go(state.view, { keepFilter: true, keepScroll: true }); }
  if (z.dataset.like) {
    const id = z.dataset.like;
    liked.has(id) ? liked.delete(id) : liked.add(id);
    saveLiked();
    if (state.likedOnly) return go(state.view, { keepFilter: true, keepScroll: true });
    const on = liked.has(id); z.setAttribute('aria-pressed', on); z.textContent = on ? '♥ 나도 그래' : '♡ 나도 그래';
  }
});
function showReading() {
  $('nightWrap').innerHTML = nightHTML();
  $('headCount').textContent = currentReading().notes.length + '장';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('nightWrap').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'sajuForm') return;
  e.preventDefault();
  const err = $('fErr'), date = $('bDate').value, time = $('bTime').value, noTime = $('bNoTime').checked;
  const fail = msg => { err.textContent = msg; err.hidden = false; };
  if (!date) return fail('생년월일을 입력해주세요.');
  const y = +date.slice(0, 4);
  if (y < 1900 || y > 2100) return fail('1900년부터 2100년 사이의 날짜로 입력해주세요.');
  if (!noTime && !time) return fail('태어난 시간을 입력하거나 "태어난 시간을 몰라요"를 체크해주세요.');
  err.hidden = true;
  state.guest = { date, time, noTime };
  state.sajuMode = 'guest';
  showReading();
});
document.addEventListener('change', e => {
  if (e.target.id === 'bNoTime') { $('bTime').disabled = e.target.checked; $('fErr').hidden = true; }
});
document.addEventListener('input', e => { if (e.target.closest && e.target.closest('#sajuForm')) $('fErr').hidden = true; });
// 지도 위 놀이기구는 키보드로도 들어갈 수 있게
document.addEventListener('keydown', e => {
  const z = e.target.closest && e.target.closest('.zone');
  if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); z.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});

$('gateWheel').innerHTML = WHEEL;
$('enterBtn').addEventListener('click', () => {
  const btn = $('enterBtn');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return go('map');
  btn.classList.add('torn');
  setTimeout(() => { btn.classList.remove('torn'); go('map'); }, 380);
});

// 링크 끝에 #map, #bought, #rule, #tier, #saju 를 붙이면 그 화면부터 열려요
const start = (location.hash || '').slice(1);
if (start === 'map' || SECTIONS.some(s => s.key === start)) go(start);
</script>
